<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carbon intensity across Great Britain, live</title>
    <meta
      name="description"
      content="Live carbon intensity and generation mix from the National Energy System Operator, with a gauge for the current reading, a forecast-vs-actual chart and a stacked mix chart. Built with Lattice Grid loaded by script tag, with no install and no build."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet, from jsDelivr. Every address on this page names
      the exact release, 1.87.0, and carries the hash of the file it expects,
      so the page can never quietly pick up a different build than the one it
      was checked against.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.latticegrid.dev/lattice-grid@1.111.5/lattice-grid.min.css"
      integrity="sha384-YYCVSW2Grlg2nCAj80ZKjxqJiof9p6cT85k25lyRwuKRAmKYDiHOS2wjIdJiH0Sa"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>Carbon intensity across Great Britain, live</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.111.5/lattice-grid.min.js"
      integrity="sha384-6loaUPtDujtZ+ZskgS2MoIywXY9uu3b8G7PSdp2HysicgZlf+K3gvlWaNH6Ksrdg"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.111.5/modules/charts.min.js"
      integrity="sha384-TxqQnLD06DeW5mIhKiatCBkldCAi0Hc+O94FEdnwzOZCJ5HUDqQJIf6V3z89phFy"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.111.5/modules/data-router.min.js"
      integrity="sha384-H0G5+XPhYe+fBFOSqemkrADxQaSJRGNknOTLxwACdeVYlAe9y0/0oHCdi8toQ6cs"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.111.5/modules/kpi.min.js"
      integrity="sha384-CKsLJ/7B9lY5wQFUgEuk/tiAMdEoF+mKyHMDqn6/tyKIhveg8hMckSSQJI+/CcPU"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.111.5/modules/tabs.min.js"
      integrity="sha384-mSCRQ4665f7g4BGR8RsGs24iXbSMDF5S8stkP4t1Z1yMDsS5ADhISmrHiBjSnhXB"
      crossorigin="anonymous"
    ></script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/carbon-feed.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
